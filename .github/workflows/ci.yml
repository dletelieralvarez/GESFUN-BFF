# Nombre del pipeline 
name: CI/CD GesFun BFF

# Define cuándo se ejecuta el pipeline
on:
  # Permite ejecutarlo manualmente desde GitHub Actions
  workflow_dispatch:

  # Se ejecuta al hacer push a main o develop
  push:
    branches: [ main, develop ]

  # Se ejecuta al hacer Pull Request hacia main o develop
  pull_request:
    branches: [ main, develop ]

jobs:
  # Job 1: compila y prueba el proyecto Spring Boot
  build:
    runs-on: ubuntu-latest

    steps:
      # Descarga el código del repositorio
      - name: Descargar código
        uses: actions/checkout@v4

      # Instala Java 21 para compilar el BFF
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compila y ejecuta tests con Maven
      - name: Ejecutar tests y compilar
        run: chmod +x mvnw && ./mvnw --batch-mode clean test

  # Job 2: construye la imagen Docker y la sube a DockerHub
  docker:
    needs: build
    runs-on: ubuntu-latest

    # Solo publica imagen cuando el push es a main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Descarga el código del repositorio
      - name: Descargar código
        uses: actions/checkout@v4

      # Inicia sesión en DockerHub usando Secrets
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construye la imagen Docker y la publica en DockerHub
      - name: Construir y publicar imagen BFF
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gesfun-bff:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gesfun-bff:${{ github.sha }}

  # Job 3: se conecta por SSH a la EC2 y despliega el contenedor
  deploy:
    needs: docker
    runs-on: ubuntu-latest

    # Solo despliega cuando el push es a main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Crea archivo de clave privada para conectarse a EC2
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # Entra a la EC2, descarga la nueva imagen y reinicia el contenedor
      - name: Desplegar BFF en EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'

            # Login en DockerHub desde la EC2
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Descarga la última imagen del BFF
            docker pull "${{ secrets.DOCKERHUB_USERNAME }}/gesfun-bff:latest"

            # Detiene y elimina el contenedor anterior si existe
            docker stop gesfun-bff || true
            docker rm gesfun-bff || true

            # Levanta el BFF en el puerto 8080
            docker run -d --name gesfun-bff \
              --restart always \
              -p 8080:8080 \
              -e BACKEND_URL="http://52.5.22.46:8080" \
              -e CORS_ALLOWED_ORIGINS="http://44.205.171.7,http://44.205.171.7:80" \
              "${{ secrets.DOCKERHUB_USERNAME }}/gesfun-bff:latest"

            # Muestra contenedores activos para validar despliegue
            docker ps

          EOF
